<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <title>Streamlink Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // apply the saved theme before first paint (no flash)
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/channels"><span class="logo"></span><span>Streamlink Studio</span></a>
    <nav id="nav">
      <a href="#/channels" data-route="channels"></a>
      <a href="#/recordings" data-route="recordings"></a>
      <a href="#/saved" data-route="saved"></a>
      <a href="#/settings" data-route="settings"></a>
    </nav>
    <div class="spacer"></div>
    <a id="bell" class="icon-btn bell" href="#/notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 9H3c0-1 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span class="bell-badge" id="bell-badge" hidden></span></a>
    <select id="lang" aria-label="Language"></select>
    <button id="theme" class="icon-btn" aria-label="Theme"></button>
    <button id="logout" class="icon-btn" aria-label="Sign out" hidden>⏻</button>
  </header>
  <div id="update-banner" class="update-banner" hidden></div>
  <main id="view"></main>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
