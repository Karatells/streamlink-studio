<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <meta name="robots" content="noindex">
  <title>Streamlink Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body class="login-body">
  <div class="login-wrap">
    <main class="login-card card">
      <div class="login-brand"><span class="logo big"></span><span>Streamlink Studio</span></div>
      <h1 data-i18n="login_title">Sign in</h1>
      <p class="muted login-sub" data-i18n="login_subtitle"></p>

      <form id="form" novalidate>
        <div class="field">
          <label for="u" data-i18n="login_username">Username</label>
          <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
        </div>
        <div class="field">
          <label for="p" data-i18n="login_password">Password</label>
          <div class="pw">
            <input type="password" id="p" name="password" autocomplete="current-password" required>
            <button type="button" id="eye" class="eye" aria-label="Show password" aria-pressed="false">
              <svg id="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="remember" checked> <span data-i18n="login_remember">Remember me for 30 days</span></label>
        <div id="err" class="login-error" role="alert" hidden></div>
        <button type="submit" id="go" class="btn primary login-btn"><span class="spin" hidden></span><span data-i18n="login_submit">Sign in</span></button>
      </form>

      <div class="login-foot">
        <select id="lang" aria-label="Language"></select>
        <button id="theme" class="icon-btn" type="button" aria-label="Theme"></button>
      </div>
    </main>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
